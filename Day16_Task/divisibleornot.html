<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divisible or not</title>
</head>
<body>
    <script>
        let num=15;
        if(num%3==0 && num%5==0){
            console.log("The given number is divisible by 3 and 5");
            document.write("The given number is divisible by 3 and 5");
            alert("The given number is divisible by 3 and 5");
        }
        else{
            console.log("The given number is not divisible by 3 and 5");
            document.write("The given number is not divisible by 3 and 5");
            alert("The given number is not divisible by 3 and 5");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        h2{
            text-align: center;
        }
        body{
            background-color: white;
        }
        div{
            border: 3px solid rgb(243, 240, 240);
            height: 50%;
            width: 50%;
            margin: 4%;
            margin-left: 400px;
            box-shadow: 0 2px 8px gray;
            border-radius: 10px;
            padding: 20px;
        }
        label{
            display: block;
            margin-top: 15px;
            font-weight: bold;

        }
        input , textarea{
            width: 95%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button{
            width: 90%;
            padding: 12px;
            margin-top: 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 40px;
            
        }
    </style>
</head>
<body>
    <div>
        <h2>Contact Us</h2>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <label for="mail">Email</label>
            <input type="email" id="mail" placeholder="Enter your email" required>
            <label for="phone">Phone Number</label>
            <input type="tell" id="phone" placeholder="Enter your phone number" required>
            <label for="msg">Message</label>
            <textarea rows="6" placeholder="Enter your message...."></textarea>
            <button>Send Message</button>        
        </form>
    </div>
</body>
</html>

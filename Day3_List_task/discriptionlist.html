<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description_List</title>
    <style>
        body{
            background-color: rgb(177, 235, 232);
        }
        h2{
            text-align: center;
            text-shadow: 1px 1px 1px;
            color: deeppink;
        }
        dl{
            background-color: rgb(232, 185, 192);
            border: 2px solid deeppink;
            border-radius: 5px;
            padding: 30px;
            width: 350px;
            height: 300px;
            margin: auto;
        }
        dt{
            color: darkred;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h2>My Website Technologies</h2>
        <dl>
            <dt>HTML</dt>
            <dd>HTML is used to create the structure of webpage.</dd>
            <br><br>
            <dt>CSS</dt>
            <dd>CSS is used to style and design the webpage.</dd>
            <br><Br>
            <dt>JavaScript</dt>
            <dd>JS is used to make interactive webpage.</dd>
            <br><br>
            <dt>React</dt>
            <dd>React is used to bulid user interfaces and resuable components.</dd>
        </dl>
    </div>
</body>
</html>

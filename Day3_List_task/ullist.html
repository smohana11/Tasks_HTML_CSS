<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UL_List</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .parent{
            border: 2px solid white;
            background-color: rgb(55, 48, 77);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
             text-transform: uppercase;
            text-shadow: 1.5px 1.5px 1.5px;
        }
        .list ul{
            list-style: none;
            display: flex;
            gap: 70px;
            margin-right: 300px;
        }
        .list a{
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="parent">
    <div class="name"><h2>MOHANA S</h2></div>
    <div class="list">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Skills</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </div>
    </nav>
</body>
</html>

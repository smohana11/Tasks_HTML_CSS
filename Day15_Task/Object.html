<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        let student = {
        name: "Mohana",
        age: 21,
        course: "FullStack"
        };

        console.log("Name: " + student.name);
        console.log("Age: " + student.age);
        console.log("Course: " + student.course);
    </script>
</body>
</html>
